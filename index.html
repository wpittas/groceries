<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a7d34" />
  <title>Shared Grocery List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="card shared-card">
      <h1>Shared Grocery List</h1>
      <div class="input-row">
        <input id="sharedInput" type="text" placeholder="Add an item..." autocomplete="off" />
        <button id="sharedAddButton" type="button">Add</button>
      </div>
      <button id="refreshSharedButton" class="secondary">Refresh</button>
      <ul id="sharedList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
